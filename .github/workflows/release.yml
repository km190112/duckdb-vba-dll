# タグ (v1.2.3) を打つと DLL をビルドし、zip にして Release に添付する。
#
# CI (ci.yml) とは別ファイルにしてある。ci.yml も release ビルドまでやっているが、
# あちらの成果物は upload-artifact で 14 日で消える検証用。こちらは配布用に残す。
#
# zip にするのは dist/ の既存の配布形態に合わせるため。DLL は 1 本 26MB あり、
# zip で 9MB 程度に落ちる。中身は DLL 1 ファイルだけという構成も踏襲する。
#
# actions は ci.yml と同じ流儀で SHA 固定する。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '手動実行時に添付先とするタグ (例 v0.1.0)'
        required: true

# Release を作るには contents: write が要る。無いと 403 で落ちる。
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust ツールチェーン
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # SHA 固定するとこのアクションは ref 名からツールチェーンを判定できない。
          # ci.yml と同じ理由で明示する。
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # DuckDB をソースからビルドするため、キャッシュが無いと 10 分以上かかる
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: リリースビルド
        run: cargo build --workspace --release --locked

      - name: DLL を zip にまとめる
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # 1 件しか返らないと配列でなく単一オブジェクトになり .Count が落ちるため @() で包む
          $dlls = @(Get-ChildItem target/release/duckdb_*.dll)
          if ($dlls.Count -eq 0) {
            Write-Host "::error::target/release に duckdb_*.dll がありません"
            exit 1
          }
          foreach ($d in $dlls) {
            Compress-Archive -Path $d.FullName -DestinationPath "dist/$($d.BaseName).zip" -Force
          }
          @(Get-ChildItem dist) | Format-Table Name, Length

      - name: Release に添付
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
