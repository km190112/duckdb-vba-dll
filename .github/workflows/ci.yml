name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じブランチに連続 push したとき、古い実行を捨てる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 明示しないとリポジトリ既定の権限 (書き込み込みのことが多い) で GITHUB_TOKEN が渡る。
# この CI は読むだけ (Release は作らない) なので read に絞る。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # DLL は Windows x64 専用で、境界テストも VARIANT / SAFEARRAY を実際に通すため
    # Windows ランナーでしか意味を持たない。
    runs-on: windows-latest

    steps:
      # アクションは SHA で固定する。タグは書き換え可能で、供給元が侵害されると
      # 同じ参照のまま中身が差し替わる。public リポジトリで DLL を配る以上、
      # 成果物に細工されると利用者に波及する。更新は dependabot.yml が拾う。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust ツールチェーン
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # SHA 固定するとこのアクションは ref 名からツールチェーンを判定できない
          # (@stable のときは ref 名 "stable" を見ている)。必ず明示すること。
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # DuckDB をソースからビルドするため、キャッシュが無いと毎回 10 分以上かかる
      - name: 依存とビルド成果物のキャッシュ
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: 書式の確認
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust テスト
        run: cargo test --workspace

      - name: リリースビルド
        run: cargo build --workspace --release

      # ここが本命。.NET の [MarshalAs(UnmanagedType.Struct)] ref object は
      # VARIANT* として渡るため、VBA の ByRef ... As Variant とまったく同じ ABI を
      # 通る。Excel を起動せずに VBA 境界そのものを検証できる。
      - name: VBA 境界テスト
        shell: pwsh
        run: ./tests/vba_boundary_test.ps1

      - name: VBA モジュールが再生成と一致するか
        shell: pwsh
        run: |
          ./vba/generate_modules.ps1
          $changed = git status --porcelain vba/
          if ($changed) {
            Write-Host "生成物がテンプレートと一致しません。" -ForegroundColor Red
            Write-Host "vba/DuckDb.template.txt を直したあと generate_modules.ps1 を実行して commit してください。"
            Write-Host $changed
            exit 1
          }
          Write-Host "vba/*.bas はテンプレートと一致しています"

      - name: DLL を成果物として保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckdb-dlls-x64
          path: target/release/duckdb_*.dll
          retention-days: 14
