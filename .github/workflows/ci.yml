name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じブランチに連続 push したとき、古い実行を捨てる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 明示しないとリポジトリ既定の権限 (書き込み込みのことが多い) で GITHUB_TOKEN が渡る。
# この CI は読むだけ (Release は作らない) なので read に絞る。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # DLL は Windows x64 専用で、境界テストも VARIANT / SAFEARRAY を実際に通すため
    # Windows ランナーでしか意味を持たない。
    runs-on: windows-latest

    steps:
      # アクションは SHA で固定する。タグは書き換え可能で、供給元が侵害されると
      # 同じ参照のまま中身が差し替わる。public リポジトリで DLL を配る以上、
      # 成果物に細工されると利用者に波及する。更新は dependabot.yml が拾う。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # public リポジトリなので、社内固有情報が混入したら即座に世界へ出る。
      # 2026-08-08 に別リポジトリ (daily_file_launcher) で、社内サーバ名と
      # 「社外秘」を含む UNC パスが約 3.5 か月 public に出ていた事故があった。
      # 人の目視に頼らず機械的に止める。ビルドの前に置いて早く落とす。
      #
      # 対象はテキストファイルのみ。dist/*.zip の中身 (配布 DLL) は対象外。
      # Rust は panic 位置の記録としてツールチェーンの絶対パスを埋め込むため
      # 必ず C:\Users\<ビルド機のユーザー名> が入る。これを落とすと常に赤くなる。
      - name: 社内情報が混入していないか
        shell: pwsh
        run: |
          # ここに実際のサーバ名や個人名を書いてはいけない。
          # 書いた時点でこの public リポジトリがその名前を公開することになり、
          # 検出しようとしているものを自分で作り出す。
          # 秘密そのものではなく「構造的な特徴」で拾う。
          $patterns = @(
            '社外秘', '部外秘', 'CONFIDENTIAL',   # 機密区分の表記
            '個人フォルダ',                        # 社内共有の典型フォルダ名
            '\\\\[A-Za-z0-9_-]*\d{3}\\',          # ホスト名が3桁数字で終わるUNC (社内サーバの命名によくある)
            '[A-Za-z]:\\Users\\[A-Za-z0-9_]+'     # 開発機の絶対パス
          )
          $fail = 0
          Get-ChildItem -Path . -Include *.rs,*.toml,*.ps1,*.bas,*.txt,*.md,*.html -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '[\\/]\.git[\\/]' -and
              $_.FullName -notmatch '[\\/]target[\\/]' -and
              # このステップ自身がパターン文字列を含むため、走査対象から外す
              $_.FullName -notmatch '[\\/]\.github[\\/]'
            } |
            ForEach-Object {
              $text = Get-Content $_.FullName -Raw -Encoding UTF8 -ErrorAction SilentlyContinue
              if ($null -eq $text) { return }
              foreach ($p in $patterns) {
                if ($text -match $p) {
                  $rel = Resolve-Path -Relative $_.FullName
                  Write-Host "::error file=$rel::社内固有情報の疑い: パターン '$p' に一致 (該当: $($Matches[0]))"
                  $fail = 1
                }
              }
            }
          if ($fail -eq 0) { Write-Host "検出なし" }
          exit $fail

      - name: Rust ツールチェーン
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # SHA 固定するとこのアクションは ref 名からツールチェーンを判定できない
          # (@stable のときは ref 名 "stable" を見ている)。必ず明示すること。
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # DuckDB をソースからビルドするため、キャッシュが無いと毎回 10 分以上かかる
      - name: 依存とビルド成果物のキャッシュ
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: 書式の確認
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust テスト
        run: cargo test --workspace

      - name: リリースビルド
        run: cargo build --workspace --release

      # ここが本命。.NET の [MarshalAs(UnmanagedType.Struct)] ref object は
      # VARIANT* として渡るため、VBA の ByRef ... As Variant とまったく同じ ABI を
      # 通る。Excel を起動せずに VBA 境界そのものを検証できる。
      - name: VBA 境界テスト
        shell: pwsh
        run: ./tests/vba_boundary_test.ps1

      - name: VBA モジュールが再生成と一致するか
        shell: pwsh
        run: |
          ./vba/generate_modules.ps1
          $changed = git status --porcelain vba/
          if ($changed) {
            Write-Host "生成物がテンプレートと一致しません。" -ForegroundColor Red
            Write-Host "vba/DuckDb.template.txt を直したあと generate_modules.ps1 を実行して commit してください。"
            Write-Host $changed
            exit 1
          }
          Write-Host "vba/*.bas はテンプレートと一致しています"

      - name: DLL を成果物として保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckdb-dlls-x64
          path: target/release/duckdb_*.dll
          retention-days: 14
